<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 320px;
            width: 100%;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #f0f0f0;
        }
        h1 {
            margin: 10px 0;
            color: #333;
            font-size: 24px;
        }
        p.role {
            color: #777;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .bio {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            padding: 10px 25px;
            background-color: #764ba2;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .button:hover {
            background-color: #5a387e;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- เปลี่ยน URL รูปภาพตรงนี้ -->
        <img src="https://github.com/chakracha1.png" alt="Profile Picture" class="avatar">
        
        <h1>Chakracha1</h1>
        <p class="role">Developer</p>
        
        <p class="bio">
            สวัสดีครับ! ยินดีต้อนรับสู่โปรไฟล์ของผม 
            ชอบเรียนรู้เทคโนโลยีใหม่ๆ และสร้างสรรค์สิ่งต่างๆ
        </p>
        
        <a href="https://github.com/chakracha1" class="button">Contact Me</a>
    </div>

</body>
</html>
